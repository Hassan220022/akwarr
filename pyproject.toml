[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akwarr"
version = "0.1.0"
description = "Radarr/Sonarr API shim for Jellyseerr — downloads Arabic media from Akwam for Jellyfin"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "mikawi" }]
keywords = ["jellyseerr", "jellyfin", "radarr", "sonarr", "akwam", "arabic", "media"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "aiosqlite>=0.20.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
akwarr-radarr = "akwarr.main:run_radarr"
akwarr-sonarr = "akwarr.main:run_sonarr"

[tool.hatch.build.targets.wheel]
packages = ["akwarr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
